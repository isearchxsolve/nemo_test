[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpath"
version = "0.1.0"
description = "OpenPath: AI-native test automation framework (open-source UiPath competitor)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenPath Contributors" }]
keywords = ["testing", "automation", "playwright", "llm", "rpa", "ai", "e2e"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.42.0",
    "selenium>=4.15.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pillow>=10.0.0",
    "pixelmatch>=0.3.0",
    "mss>=9.0.1;platform_system=='Windows'",
]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54", "mss>=9.0.1"]
dev = ["pytest>=8.0.0", "pytest-mock>=3.12.0", "respx>=0.20.2"]

[project.scripts]
openpath = "openpath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openpath.report" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
